<script>
(function() {
    'use strict';

    // ===== DOM =====
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const workspace = document.getElementById('workspace');
    const previewCanvas = document.getElementById('previewCanvas');
    const ctx = previewCanvas.getContext('2d');

    const formatSelect = document.getElementById('formatSelect');
    const qualitySlider = document.getElementById('qualitySlider');
    const qualityVal = document.getElementById('qualityVal');
    const qualityRow = document.getElementById('qualityRow');

    const widthInput = document.getElementById('widthInput');
    const heightInput = document.getElementById('heightInput');
    const lockBtn = document.getElementById('lockBtn');
    const percentageMode = document.getElementById('percentageMode');

    const origSizeEl = document.getElementById('origSize');
    const newSizeEl = document.getElementById('newSize');
    const reducedEl = document.getElementById('reduced');
    const outputInfo = document.getElementById('outputInfo');

    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');

    const toastEl = document.getElementById('toast');

    // ===== State =====
    let originalImage = null;       // HTMLImageElement
    let aspectLocked = true;
    let origW = 0, origH = 0;
    let rotation = 0;               // 0, 90, 180, 270
    let flipH = false;
    let flipV = false;

    // ===== Toast =====
    let toastTimer;
    function showToast(msg) {
        clearTimeout(toastTimer);
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        toastTimer = setTimeout(function() {
            toastEl.classList.remove('show');
        }, 2000);
    }

    // ===== Format size =====
    function formatSize(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // ===== Get edited dimensions =====
    function getEditedDims() {
        let w = parseInt(widthInput.value) || origW;
        let h = parseInt(heightInput.value) || origH;
        if (percentageMode.checked) {
            w = Math.round(origW * w / 100);
            h = Math.round(origH * h / 100);
        }
        return { w: Math.max(1, w), h: Math.max(1, h) };
    }

    // ===== Update preview =====
    function updatePreview() {
        if (!originalImage) return;

        var dims = getEditedDims();
        var w = dims.w;
        var h = dims.h;

        // Determine canvas size based on rotation
        var isRotated = (rotation === 90 || rotation === 270);
        var cw = isRotated ? h : w;
        var ch = isRotated ? w : h;

        previewCanvas.width = cw;
        previewCanvas.height = ch;

        ctx.clearRect(0, 0, cw, ch);
        ctx.save();

        // Translate to center, apply rotation, flip
        ctx.translate(cw / 2, ch / 2);
        ctx.rotate((rotation * Math.PI) / 180);
        ctx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
        ctx.drawImage(originalImage, -w / 2, -h / 2, w, h);

        ctx.restore();

        // Estimate output size
        estimateSize();
    }

    // ===== Estimate output size =====
    function estimateSize() {
        var format = formatSelect.value;
        var quality = parseInt(qualitySlider.value) / 100;

        if (format === 'image/png') {
            // PNG doesn't use quality parameter in toBlob
            previewCanvas.toBlob(function(blob) {
                if (blob) {
                    newSizeEl.textContent = formatSize(blob.size);
                    updateReduced(blob.size);
                    outputInfo.textContent = format.replace('image/', '').toUpperCase();
                }
            }, 'image/png');
        } else {
            previewCanvas.toBlob(function(blob) {
                if (blob) {
                    newSizeEl.textContent = formatSize(blob.size);
                    updateReduced(blob.size);
                    var fmt = format.replace('image/', '').toUpperCase();
                    outputInfo.textContent = fmt + ' (' + (quality * 100).toFixed(0) + '%)';
                }
            }, format, quality);
        }
    }

    function updateReduced(newBytes) {
        if (!originalImage || !originalImage._origSize) return;
        var origBytes = originalImage._origSize;
        var diff = origBytes - newBytes;
        var pct = origBytes > 0 ? Math.round((diff / origBytes) * 100) : 0;

        if (diff > 0) {
            reducedEl.innerHTML = '<span class="size-reduced">-' + pct + '% (' + formatSize(diff) + ')</span>';
        } else if (diff < 0) {
            reducedEl.textContent = '+' + formatSize(Math.abs(diff));
        } else {
            reducedEl.textContent = '--';
        }
    }

    // ===== Update size inputs =====
    function updateSizeInputs() {
        var pct = percentageMode.checked;
        if (pct) {
            var wRatio = origW > 0 ? Math.round((parseInt(widthInput.value) || origW) / origW * 100) : 100;
            widthInput.value = wRatio;
            heightInput.value = wRatio;
        } else {
            widthInput.value = origW;
            heightInput.value = origH;
        }
        updatePreview();
    }

    // ===== Load image =====
    function loadImage(file) {
        if (!file || !file.type.match(/image\//)) {
            showToast('请选择有效的图片文件');
            return;
        }

        var reader = new FileReader();
        reader.onload = function(e) {
            var img = new Image();
            img.onload = function() {
                originalImage = img;
                originalImage._origSize = file.size;
                origW = img.naturalWidth;
                origH = img.naturalHeight;
                rotation = 0;
                flipH = false;
                flipV = false;

                // Update UI
                origSizeEl.textContent = formatSize(file.size);
                widthInput.value = origW;
                heightInput.value = origH;
                qualitySlider.value = 80;
                qualityVal.textContent = '80%';
                formatSelect.value = 'image/jpeg';
                percentageMode.checked = false;

                // Show workspace
                uploadArea.style.display = 'none';
                workspace.classList.add('active');

                updatePreview();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // ===== Download =====
    function doDownload() {
        if (!originalImage) return;

        var format = formatSelect.value;
        var quality = parseInt(qualitySlider.value) / 100;
        var ext = format.replace('image/', '');
        if (ext === 'jpeg') ext = 'jpg';

        if (format === 'image/png') {
            previewCanvas.toBlob(function(blob) {
                triggerDownload(blob, 'image.' + ext);
            }, 'image/png');
        } else {
            previewCanvas.toBlob(function(blob) {
                triggerDownload(blob, 'image.' + ext);
            }, format, quality);
        }
    }

    function triggerDownload(blob, filename) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('下载已开始');
    }

    // ===== Reset =====
    function doReset() {
        if (!originalImage) return;
        rotation = 0;
        flipH = false;
        flipV = false;
        widthInput.value = origW;
        heightInput.value = origH;
        percentageMode.checked = false;
        updatePreview();
        showToast('已恢复原始状态');
    }

    // ===== Rotate =====
    function rotateLeft() {
        rotation = (rotation - 90 + 360) % 360;
        updatePreview();
    }
    function rotateRight() {
        rotation = (rotation + 90) % 360;
        updatePreview();
    }
    function rotate180() {
        rotation = (rotation + 180) % 360;
        updatePreview();
    }

    // ===== Flip =====
    function toggleFlipH() {
        flipH = !flipH;
        updatePreview();
    }
    function toggleFlipV() {
        flipV = !flipV;
        updatePreview();
    }

    // ===== Events =====

    // Upload
    uploadArea.addEventListener('click', function() {
        fileInput.click();
    });
    fileInput.addEventListener('change', function(e) {
        if (e.target.files && e.target.files[0]) {
            loadImage(e.target.files[0]);
        }
    });

    // Drag & drop
    uploadArea.addEventListener('dragover', function(e) {
        e.preventDefault();
        uploadArea.classList.add('drag-over');
    });
    uploadArea.addEventListener('dragleave', function(e) {
        e.preventDefault();
        uploadArea.classList.remove('drag-over');
    });
    uploadArea.addEventListener('drop', function(e) {
        e.preventDefault();
        uploadArea.classList.remove('drag-over');
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
            loadImage(e.dataTransfer.files[0]);
        }
    });

    // Format change
    formatSelect.addEventListener('change', function() {
        var fmt = formatSelect.value;
        qualityRow.style.display = (fmt === 'image/png') ? 'none' : '';
        updatePreview();
    });

    // Quality slider
    qualitySlider.addEventListener('input', function() {
        qualityVal.textContent = qualitySlider.value + '%';
        updatePreview();
    });

    // Size inputs
    widthInput.addEventListener('input', function() {
        var w = parseInt(widthInput.value) || origW;
        if (aspectLocked && origW > 0 && origH > 0) {
            if (percentageMode.checked) {
                heightInput.value = w;
            } else {
                heightInput.value = Math.round(w * origH / origW);
            }
        }
        updatePreview();
    });
    heightInput.addEventListener('input', function() {
        var h = parseInt(heightInput.value) || origH;
        if (aspectLocked && origW > 0 && origH > 0) {
            if (percentageMode.checked) {
                widthInput.value = h;
            } else {
                widthInput.value = Math.round(h * origW / origH);
            }
        }
        updatePreview();
    });

    // Lock button
    lockBtn.addEventListener('click', function() {
        aspectLocked = !aspectLocked;
        if (aspectLocked) {
            lockBtn.classList.add('locked');
            lockBtn.innerHTML = '&#128279;';
            // Sync heights to current width ratio
            var w = parseInt(widthInput.value) || origW;
            if (percentageMode.checked) {
                heightInput.value = w;
            } else {
                heightInput.value = origW > 0 ? Math.round(w * origH / origW) : origH;
            }
        } else {
            lockBtn.classList.remove('locked');
            lockBtn.innerHTML = '&#128275;';
        }
        updatePreview();
    });

    // Percentage mode
    percentageMode.addEventListener('change', function() {
        updateSizeInputs();
    });

    // Preset buttons
    document.querySelectorAll('[data-preset]').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var pct = parseInt(btn.dataset.preset);
            percentageMode.checked = true;
            widthInput.value = pct;
            heightInput.value = pct;
            updatePreview();
        });
    });

    // Rotate buttons
    document.getElementById('rotateLeftBtn').addEventListener('click', rotateLeft);
    document.getElementById('rotateRightBtn').addEventListener('click', rotateRight);
    document.getElementById('rotate180Btn').addEventListener('click', rotate180);

    // Flip buttons
    document.getElementById('flipHBtn').addEventListener('click', toggleFlipH);
    document.getElementById('flipVBtn').addEventListener('click', toggleFlipV);

    // Download
    downloadBtn.addEventListener('click', doDownload);

    // Reset
    resetBtn.addEventListener('click', doReset);

    // Keyboard shortcuts
    document.addEventListener('keydown', function(e) {
        if (!originalImage) return;
        // Don't trigger when typing in input fields
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

        if (e.ctrlKey || e.metaKey) {
            switch (e.key.toLowerCase()) {
                case 's':
                    e.preventDefault();
                    doDownload();
                    break;
                case 'r':
                    e.preventDefault();
                    doReset();
                    break;
                case 'z':
                    e.preventDefault();
                    rotateLeft();
                    break;
                case 'x':
                    e.preventDefault();
                    rotateRight();
                    break;
            }
        }
    });

})();
</script>

</body>
</html>
