<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="页面未找到 - 404错误">
    <meta name="robots" content="noindex, follow">
    <title>404 - 页面未找到 | 我的工具箱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.6;
        }

        .error-container {
            text-align: center;
            padding: 40px 20px;
            max-width: 500px;
        }
        .error-code {
            font-size: 100px;
            font-weight: 800;
            color: #4361ee;
            line-height: 1;
            margin-bottom: 16px;
            letter-spacing: 4px;
        }
        .error-title {
            font-size: 24px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 12px;
        }
        .error-desc {
            font-size: 15px;
            color: #64748b;
            margin-bottom: 32px;
        }
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s;
            font-family: inherit;
            cursor: pointer;
        }
        .btn-primary {
            background: #4361ee;
            color: #fff;
            border: none;
        }
        .btn-primary:hover {
            background: #3b56d4;
        }
        .btn-outline {
            background: #fff;
            color: #4361ee;
            border: 1px solid #4361ee;
        }
        .btn-outline:hover {
            background: #eef0ff;
        }

        @media (max-width: 640px) {
            .error-code { font-size: 72px; }
            .error-title { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">页面未找到</h1>
        <p class="error-desc">抱歉，您要查找的页面不存在或已被移除。请检查URL是否正确，或返回首页浏览其他内容。</p>
        <div class="error-actions">
            <a href="index.html" class="btn btn-primary">返回首页</a>
            <a href="contact.html" class="btn btn-outline">报告问题</a>
        </div>
    </div>
</body>
</html>
